<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CHEOS Admin Panel</title>
<style>:root{--bg:#05030a;--panel:#100a18;--line:#3b2450;--text:#f7f0ff;--muted:#a99bb7;--p:#a855f7;--g:#7ee787;--r:#ff6b7a;--gold:#f6c453}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#32105d,#05030a 65%);color:var(--text);font:14px Arial,sans-serif}main{max-width:900px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.head h1{margin:0;font-size:22px}.muted{color:var(--muted);font-size:11px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}}.panel{background:rgba(16,10,24,.96);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}.field{width:100%;margin-top:8px;padding:11px;border-radius:11px;border:1px solid var(--line);background:#09060d;color:white;outline:none}.btn{border:0;border-radius:11px;padding:11px 13px;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;font-weight:800;font-size:12px}.btn.gold{background:linear-gradient(135deg,#8b5a12,#d99b26)}.btn.red{background:#7f1d2d}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:110px}.menu{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;background:#0b0710}.menuTop{display:flex;justify-content:space-between;gap:10px}.tag{padding:4px 7px;border-radius:7px;background:#1a1121;font-size:10px}.tag.vip{color:var(--gold)}.tag.free{color:var(--g)}.danger{color:var(--r)}textarea{min-height:80px;resize:vertical}.status{margin-top:10px;padding:10px;border-radius:10px;background:#0b0710;color:var(--muted);font-size:11px}.status.ok{color:var(--g)}.status.bad{color:var(--r)}label{display:block;margin-top:10px;font-size:11px;color:var(--muted)}h2{margin:0 0 10px;font-size:16px}.hidden{display:none}</style></head>
<body><main>
<div class="head"><div><h1>👑 CHEOS ADMIN PANEL</h1><div class="muted">Kelola config.json GitHub tanpa menaruh token di APK.</div></div><button class="btn red" onclick="logout()">KELUAR</button></div>
<section id="login" class="panel"><h2>🔐 Login Admin GitHub</h2><div class="muted">Token hanya dipakai di halaman ini dan tidak disimpan ke project APK. Jangan kirim token ke orang lain.</div><label>GitHub Personal Access Token</label><input id="token" class="field" type="password" autocomplete="off" placeholder="github_pat_..."><div class="grid"><div><label>Owner / Username</label><input id="owner" class="field" placeholder="username"></div><div><label>Repository</label><input id="repo" class="field" placeholder="nama-repo"></div></div><label>Branch</label><input id="branch" class="field" value="main"><label>Path config</label><input id="path" class="field" value="config.json"><div style="margin-top:12px"><button class="btn" onclick="connect()">LOGIN & AMBIL CONFIG</button></div><div id="loginStatus" class="status"></div></section>
<section id="app" class="hidden"><div class="panel"><div class="row"><button class="btn" onclick="loadRemote()">↻ MUAT ULANG</button><button class="btn" onclick="saveRemote()">☁ SIMPAN KE GITHUB</button><button class="btn gold" onclick="downloadJson()">⬇ EXPORT JSON</button></div><div id="status" class="status">Belum terhubung.</div></div>
<section class="panel"><h2>📢 App & Announcement</h2><label>Nama aplikasi</label><input id="appName" class="field"><label>Versi</label><input id="appVersion" class="field"><label>Pengumuman</label><textarea id="announcement" class="field"></textarea><div class="grid"><div><label>Telegram</label><input id="telegram" class="field"></div><div><label>YouTube</label><input id="youtube" class="field"></div></div><label>Tiktok</label><input id="tiktok" class="field"></section>
<section class="panel"><h2>➕ Tambah Menu</h2><div class="grid"><div><label>Nama</label><input id="mName" class="field"></div><div><label>ID</label><input id="mId" class="field" placeholder="drone-x1"></div><div><label>Versi</label><input id="mVersion" class="field" value="v1.0"></div><div><label>Ukuran</label><input id="mSize" class="field" value="—"></div><div><label>Icon / Emoji</label><input id="mIcon" class="field" value="🛰️"></div><div><label>Akses</label><select id="mAccess" class="field"><option>FREE</option><option>VIP</option></select></div></div><label>Deskripsi</label><textarea id="mDesc" class="field"></textarea><label>Link download</label><input id="mDownload" class="field" placeholder="https://..."><div style="margin-top:12px"><button class="btn" onclick="addMenu()">+ TAMBAH MENU</button></div></section>
<section class="panel"><h2>🧰 Daftar Menu</h2><div id="menus"></div></section>
<section class="panel"><h2>🔐 User VIP</h2><div class="grid"><div><label>Key</label><input id="uKey" class="field"></div><div><label>Nama</label><input id="uName" class="field"></div><div><label>Expired (YYYY-MM-DD)</label><input id="uExpires" class="field" placeholder="2026-12-31"></div></div><div style="margin-top:12px"><button class="btn gold" onclick="addUser()">+ TAMBAH VIP</button></div><div id="users"></div></section></section></main>
<script>
let token='',sha='',cfg={app:{},menus:[],users:[]};let meta={};const $=id=>document.getElementById(id);function apiUrl(){return `https://api.github.com/repos/${encodeURIComponent(meta.owner)}/${encodeURIComponent(meta.repo)}/contents/${meta.path.split('/').map(encodeURIComponent).join('/')}?ref=${encodeURIComponent(meta.branch)}`}
function setStatus(id,msg,ok=false){$(id).className='status '+(ok?'ok':'');$(id).textContent=msg}
async function connect(){token=$('token').value.trim();meta={owner:$('owner').value.trim(),repo:$('repo').value.trim(),branch:$('branch').value.trim()||'main',path:$('path').value.trim()||'config.json'};if(!token||!meta.owner||!meta.repo)return setStatus('loginStatus','Lengkapi token, owner, repository.');await loadRemote(true)}
function headers(){return {'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28'}}
function decodeBase64(s){const bin=atob(s.replace(/\n/g,''));const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}function encodeBase64(s){const bytes=new TextEncoder().encode(s);let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin)}
async function loadRemote(first=false){try{const r=await fetch(apiUrl(),{headers:headers(),cache:'no-store'});if(!r.ok)throw new Error('GitHub HTTP '+r.status);const j=await r.json();sha=j.sha;cfg=JSON.parse(decodeBase64(j.content));normalize();fill();$('login').classList.add('hidden');$('app').classList.remove('hidden');setStatus('status','✓ Terhubung ke GitHub: '+meta.owner+'/'+meta.repo,true)}catch(e){setStatus(first?'loginStatus':'status','Gagal: '+e.message)}}
function normalize(){cfg.app=cfg.app||{};cfg.menus=Array.isArray(cfg.menus)?cfg.menus:[];cfg.users=Array.isArray(cfg.users)?cfg.users:[]}
function fill(){$('appName').value=cfg.app.name||'';$('appVersion').value=cfg.app.version||'';$('announcement').value=cfg.app.announcement||'';$('telegram').value=cfg.app.telegram||'';$('youtube').value=cfg.app.youtube||'';$('tiktok').value=cfg.app.tiktok||'';renderMenus();renderUsers()}
function syncApp(){cfg.app={name:$('appName').value,version:$('appVersion').value,announcement:$('announcement').value,telegram:$('telegram').value,youtube:$('youtube').value,tiktok:$('tiktok').value}}
function addMenu(){const name=$('mName').value.trim();if(!name)return alert('Nama menu wajib diisi.');cfg.menus.push({id:$('mId').value.trim()||('menu-'+Date.now()),name,version:$('mVersion').value.trim(),description:$('mDesc').value.trim(),size:$('mSize').value.trim(),download:$('mDownload').value.trim(),icon:$('mIcon').value.trim(),access:$('mAccess').value,enabled:true});renderMenus()}
function editMenu(i){const m=cfg.menus[i];m.name=prompt('Nama menu:',m.name)??m.name;m.version=prompt('Versi:',m.version)??m.version;m.description=prompt('Deskripsi:',m.description)??m.description;m.download=prompt('Link download:',m.download)??m.download;m.access=(prompt('Akses FREE/VIP:',m.access)||m.access).toUpperCase()==='VIP'?'VIP':'FREE';renderMenus()}
function toggleMenu(i){cfg.menus[i].enabled=!cfg.menus[i].enabled;renderMenus()}function delMenu(i){if(confirm('Hapus menu ini?')){cfg.menus.splice(i,1);renderMenus()}}
function renderMenus(){$('menus').innerHTML=cfg.menus.map((m,i)=>`<div class="menu"><div class="menuTop"><div><b>${esc(m.icon||'🛠️')} ${esc(m.name)}</b><div class="muted">${esc(m.description||'')}</div></div><div><span class="tag ${m.access==='VIP'?'vip':'free'}">${esc(m.access)}</span> <span class="tag">${m.enabled?'ON':'OFF'}</span></div></div><div class="row" style="margin-top:10px"><button class="btn" onclick="editMenu(${i})">✏️ EDIT</button><button class="btn" onclick="toggleMenu(${i})">${m.enabled?'🔴 NONAKTIFKAN':'🟢 AKTIFKAN'}</button><button class="btn red" onclick="delMenu(${i})">🗑 HAPUS</button></div></div>`).join('')||'<div class="muted">Belum ada menu.</div>'}
function addUser(){const key=$('uKey').value.trim();if(!key)return alert('Key wajib diisi.');cfg.users.push({key,name:$('uName').value.trim()||'VIP User',expires:$('uExpires').value.trim(),active:true});renderUsers()}
function toggleUser(i){cfg.users[i].active=!cfg.users[i].active;renderUsers()}function delUser(i){if(confirm('Hapus user VIP?')){cfg.users.splice(i,1);renderUsers()}}
function renderUsers(){$('users').innerHTML=cfg.users.map((u,i)=>`<div class="menu"><div><b>🔐 ${esc(u.name)}</b><div class="muted">Key: ${esc(u.key)} • Expired: ${esc(u.expires||'—')}</div></div><div class="row" style="margin-top:10px"><button class="btn" onclick="toggleUser(${i})">${u.active?'🔴 NONAKTIFKAN':'🟢 AKTIFKAN'}</button><button class="btn red" onclick="delUser(${i})">🗑 HAPUS</button></div></div>`).join('')||'<div class="muted">Belum ada user VIP.</div>'}
async function saveRemote(){try{syncApp();const content=JSON.stringify(cfg,null,2);const body={message:'Update CHEOS config from Admin Panel',content:encodeBase64(content),sha,branch:meta.branch};const r=await fetch(apiUrl().replace(/\?ref=.*$/,'')+'?ref='+encodeURIComponent(meta.branch),{method:'PUT',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());const j=await r.json();sha=j.content.sha;setStatus('status','✓ Config berhasil disimpan ke GitHub.',true)}catch(e){setStatus('status','Gagal menyimpan: '+e.message)}}
function downloadJson(){syncApp();const blob=new Blob([JSON.stringify(cfg,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='config.json';a.click();URL.revokeObjectURL(a.href)}function logout(){token='';$('app').classList.add('hidden');$('login').classList.remove('hidden');$('token').value=''}function esc(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
</script></body></html>
